# The Site Configuration

# Import the theme
theme: jekyll-theme-chirpy

lang: en

timezone: Asia/Kolkata

title: Bharathi Sakthivel
tagline: SAP Full Stack Developer · ABAP · RAP · UI5 · Fiori · AI

description: >-
  Practical SAP development tips on ABAP, RAP, UI5, Fiori, and AI — shared with 15k+ developers on LinkedIn.

google_site_verification: Jj2FOKmQf0v86bTZCkesaDnPgGZujU6Sr3mJGY9fwcw

url: "https://bharathi1294.github.io"
baseurl: "/bharathi-sakthivel.github.io"

github:
  username: bharathi1294

social:
  name: Bharathi Sakthivel
  email: bharathi.s02@sap.com
  links:
    - https://github.com/bharathi1294
    - https://www.linkedin.com/in/bharathi-sakthivel

avatar: "/assets/images/profile.jpg"
social_preview_image: "/assets/images/profile.jpg"

author:
  name: Bharathi Sakthivel
  url: https://www.linkedin.com/in/bharathi-sakthivel

theme_mode: # follows system (dark/light toggle available)

toc: true

comments:
  provider:

pwa:
  enabled: true
  cache:
    enabled: true

paginate: 10

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
